[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastlife-quant"
version = "0.1.0"
description = "FASTLIFE QUANT AI - laboratoire quantitatif ICT/SMC pour XAUUSD"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.5",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
